<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 · Breakpoints · oplossing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #e8e4d9;
      padding: 16px;
      color: #0a0a0a;
    }
    h1 {
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      font-size: 1.35rem;
      margin: 0 0 12px;
    }
    p.note {
      font-family: "Courier New", monospace;
      font-size: 13px;
      margin: 0 0 16px;
    }

    .zone {
      background: #ff3b00;
      color: #fff;
      padding: 24px;
      border: 3px solid #0a0a0a;
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      text-align: center;
      font-size: 1.5rem;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0 #0a0a0a;
    }

    .zone::after {
      content: " · phone";
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      font-weight: normal;
      text-transform: none;
    }

    @media (min-width: 600px) {
      .zone {
        background: #0047ff;
      }
      .zone::after {
        content: " · tablet";
      }
    }

    @media (min-width: 1000px) {
      .zone {
        background: #00c853;
        color: #000;
      }
      .zone::after {
        content: " · desktop";
      }
    }
  </style>
</head>
<body>
  <h1>03 · Kleur per zone</h1>
  <p class="note">Versleep het venster: oranje → blauw @600 → groen @1000</p>
  <div class="zone">Zone</div>
</body>
</html>
