<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07 · clamp() · oplossing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #e8e4d9;
      color: #0a0a0a;
    }

    .hero {
      background: #0a0a0a;
      color: #fff;
      border-bottom: 5px solid #ff3b00;
      padding: clamp(1rem, 5vw, 3rem);
    }

    .hero h1 {
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      line-height: 1.05;
      margin: 0 0 8px;
      letter-spacing: -0.03em;
      font-size: clamp(1.5rem, 4vw + 1rem, 3.5rem);
    }

    .hero p {
      font-family: "Courier New", monospace;
      opacity: 0.85;
      margin: 0;
      max-width: 40rem;
      font-size: clamp(0.9rem, 0.5rem + 1vw, 1.1rem);
    }

    .hint {
      padding: 16px;
      font-family: "Courier New", monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Fluid type</h1>
    <p>Titel en padding schalen vloeiend met clamp(). Geen media query nodig.</p>
  </header>
  <p class="hint">min · preferred (vw + rem) · max</p>
</body>
</html>
