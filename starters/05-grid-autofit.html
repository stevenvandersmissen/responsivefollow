<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 · Grid auto-fit · starter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #e8e4d9;
      color: #0a0a0a;
      padding: 16px;
    }
    h1 {
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      font-size: 1.35rem;
      margin: 0 0 8px;
    }
    p.note {
      font-family: "Courier New", monospace;
      font-size: 13px;
      margin: 0 0 16px;
    }

    /* ========== TYP HIER ========== */
    .grid {
      /* display: grid; */
      /* grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); */
      /* gap: 16px; */
    }

    .grid > div {
      background: #0047ff;
      color: #fff;
      padding: 24px;
      border: 3px solid #0a0a0a;
      font-family: "Courier New", monospace;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>05 · Grid auto-fit</h1>
  <p class="note">repeat(auto-fit, minmax(160px, 1fr))</p>

  <div class="grid">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
</body>
</html>
