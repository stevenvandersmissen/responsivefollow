<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 · Nav · starter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #e8e4d9;
      color: #0a0a0a;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0a0a0a;
      color: #f5f1e6;
      border-bottom: 4px solid #ff3b00;
    }
    .logo {
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .toggle {
      border: 2px solid #fff;
      background: #ff3b00;
      color: #fff;
      font-family: "Courier New", monospace;
      font-weight: bold;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    /* ========== TYP HIER ========== */
    .links {
      /* mobile: display: none; */
      /* flex-direction: column; */
      gap: 8px;
      padding: 12px 16px;
      background: #f5f1e6;
      border-bottom: 3px solid #0a0a0a;
      list-style: none;
      margin: 0;
    }
    /* .links.open { display: flex; } */

    .links a {
      color: #0a0a0a;
      font-family: "Courier New", monospace;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 0;
      display: block;
    }

    /*
    @media (min-width: 800px) {
      .toggle { display: none; }
      .links {
        display: flex;
        flex-direction: row;
        background: transparent;
        border: none;
        padding: 0;
        gap: 20px;
      }
      .top { border-bottom: none; }
      .wrap-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #0a0a0a;
        padding: 12px 16px;
        border-bottom: 4px solid #ff3b00;
      }
      .links a { color: #f5f1e6; padding: 0; }
    }
    */

    main { padding: 24px 16px; max-width: 720px; margin: 0 auto; }
    main h1 {
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      font-size: 1.5rem;
    }
    main p { font-family: "Courier New", monospace; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Eenvoudige structuur: top bar + links eronder -->
  <div class="top">
    <div class="logo">6CM Studio</div>
    <button class="toggle" type="button" id="btn" aria-expanded="false" aria-controls="navlinks">☰</button>
  </div>
  <ul class="links" id="navlinks">
    <li><a href="#">Home</a></li>
    <li><a href="#">Werk</a></li>
    <li><a href="#">Over</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

  <main>
    <h1>06 · Hamburger-nav</h1>
    <p>Typ de CSS + activeer de toggle. Test &lt;800px en ≥800px.</p>
  </main>

  <script>
    // Mini toggle — vul aan of laat staan
    const btn = document.getElementById("btn");
    const links = document.getElementById("navlinks");
    btn.addEventListener("click", () => {
      const open = links.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  </script>
</body>
</html>
