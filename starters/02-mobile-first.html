<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 · Mobile-first · starter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #e8e4d9;
      color: #0a0a0a;
      padding: 16px;
    }
    h1 {
      font-family: "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      font-size: 1.4rem;
      margin: 0 0 8px;
    }
    p.note {
      font-family: "Courier New", monospace;
      font-size: 13px;
      margin: 0 0 16px;
    }

    /* ========== TYP HIER ========== */
    .row {
      /* 1) display: flex */
      /* 2) flex-direction: column */
      /* 3) gap: 12px */
    }

    /* 4) @media (min-width: 700px) {
          .row { flex-direction: row; }
          .row > * { flex: 1; }
        }
    */

    .row > div {
      background: #0a0a0a;
      color: #fff;
      padding: 20px;
      border: 3px solid #ff3b00;
      font-family: "Courier New", monospace;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>02 · Stack → rij</h1>
  <p class="note">Mobile-first: column basis, row vanaf 700px</p>

  <div class="row">
    <div>Een</div>
    <div>Twee</div>
    <div>Drie</div>
  </div>
</body>
</html>
